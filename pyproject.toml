[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrl"
version = "0.1.0"
description = "Local control plane for persistent Codex App Server threads"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
keywords = ["codex", "app-server", "agents", "orchestration", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.scripts]
ctrl = "ctrl.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
